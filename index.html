</table><script type="module">

async function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    message.textContent = "Logging in...";

    if (!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
    }

    try {

        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        console.log("Login successful:", userCredential.user.email);

        message.textContent = "Login successful!";

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("ledgerPage").style.display = "block";

        await loadLedger();

    } catch (error) {

        console.error("LOGIN ERROR:", error);

        message.textContent =
            error.code + " : " + error.message;
    }
}

async function logout() {

    try {

        await signOut(auth);

        document.getElementById("ledgerPage").style.display = "none";
        document.getElementById("loginPage").style.display = "block";

        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";
        document.getElementById("loginMessage").textContent = "";

    } catch (error) {

        console.error(error);
        alert("Logout failed.");

    }
}


function flatSelected() {

    const flat = document.getElementById("flat").value;

    if (!flat) {
        document.getElementById("maintenanceDue").value = "";
        document.getElementById("previousBalance").value = "";
        document.getElementById("balance").value = "";
        return;
    }

    const due = maintenanceRates[flat] || 0;

    document.getElementById("maintenanceDue").value = due;

    calculatePreviousBalance(flat);
}


async function calculatePreviousBalance(flat) {

    try {

        const snapshot =
            await getDocs(collection(db, "ledger"));

        let previousBalance = 0;

        snapshot.forEach((doc) => {

            const row = doc.data();

            if (
                row.flat === flat &&
                row.type === "Maintenance Received"
            ) {

                const due =
                    Number(
                        row.maintenanceDue ??
                        maintenanceRates[flat] ??
                        0
                    );

                const paid =
                    Number(
                        row.actuallyPaid ??
                        row.amount ??
                        0
                    );

                previousBalance += due - paid;
            }

        });

        document.getElementById("previousBalance").value =
            previousBalance;

        calculateCurrentBalance();

    } catch (error) {

        console.error(error);

        alert("Unable to calculate previous balance.");
    }
}


function calculateCurrentBalance() {

    const due =
        Number(
            document.getElementById("maintenanceDue").value
        ) || 0;

    const paid =
        Number(
            document.getElementById("amount").value
        ) || 0;

    const previous =
        Number(
            document.getElementById("previousBalance").value
        ) || 0;

    const currentBalance =
        previous + due - paid;

    document.getElementById("balance").value =
        currentBalance;
}
  
async function add() {

    const owner =
        document.getElementById("owner").value;

    const date =
    document.getElementById("date").value;

const maintenanceMonth =
    document.getElementById("maintenanceMonth").value;


    const flat =
        document.getElementById("flat").value;

    const type =
        document.getElementById("type").value;

    const amount =
        Number(
            document.getElementById("amount").value
        ) || 0;

    const remarks =
        document.getElementById("remarks").value;


    if (!owner || !date || !maintenanceMonth || !flat || !amount) {

    alert(
        "Please select Owner, Maintenance Month, Date, Flat and enter Amount."
    );

    return;
}


    try {

        let maintenanceDue = 0;
        let previousBalance = 0;
        let balance = 0;


        if (type === "Maintenance Received") {

            maintenanceDue =
                maintenanceRates[flat] || 0;


            const snapshot =
                await getDocs(collection(db, "ledger"));


            snapshot.forEach((doc) => {

                const row = doc.data();


                if (
                    row.flat === flat &&
                    row.type === "Maintenance Received"
                ) {

                    const oldDue =
                        Number(
                            row.maintenanceDue ??
                            maintenanceRates[flat] ??
                            0
                        );


                    const oldPaid =
                        Number(
                            row.actuallyPaid ??
                            row.amount ??
                            0
                        );


                    previousBalance +=
                        oldDue - oldPaid;
                }

            });


            balance =
                previousBalance +
                maintenanceDue -
                amount;
        }


        await addDoc(
            collection(db, "ledger"),
            {

                owner: owner,
   maintenanceMonth: maintenanceMonth,


                date: date,

                flat: flat,

                type: type,

                amount: amount,

                maintenanceDue:
                    maintenanceDue,

                actuallyPaid:
                    type === "Maintenance Received"
                        ? amount
                        : 0,

                previousBalance:
                    previousBalance,

                balance:
                    balance,

                remarks:
                    remarks,

                createdAt:
                    new Date()
            }
        );


        alert("Entry added successfully.");


        document.getElementById("owner").value = "";

document.getElementById("maintenanceMonth").value = "";

document.getElementById("date").value = "";

        document.getElementById("flat").value = "";

        document.getElementById("amount").value = "";

        document.getElementById("maintenanceDue").value = "";

        document.getElementById("previousBalance").value = "";

        document.getElementById("balance").value = "";

        document.getElementById("remarks").value = "";


        await loadLedger();


    } catch (error) {

        console.error(error);

        alert(error.message);
    }
}


async function loadLedger() {

    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";

    try {

        const snapshot = await getDocs(collection(db, "ledger"));

        snapshot.forEach((doc) => {

            const row = doc.data();

            const tr = document.createElement("tr");

            tr.innerHTML = `
<td>${row.owner || ""}</td>
<td>${row.maintenanceMonth || ""}</td>
<td>${row.date || ""}</td>
<td>${row.flat || ""}</td>
    <td>${row.type || ""}</td>

    <td>
        ${
            row.type === "Maintenance Received"
            ? "₹" + (row.maintenanceDue || 0)
            : ""
        }
    </td>

    <td>
        ${
            row.type === "Maintenance Received"
            ? "₹" + (row.actuallyPaid ?? row.amount ?? 0)
            : ""
        }
    </td>

    <td>
        ${
            row.type === "Maintenance Received"
            ? "₹" + (row.previousBalance || 0)
            : ""
        }
    </td>

    <td>
        ${
            row.type === "Maintenance Received"
            ? "₹" + (row.balance || 0)
            : ""
        }
    </td>

    <td>${row.remarks || ""}</td>
`;

            tbody.appendChild(tr);

        });

    } catch (error) {
    console.error(error);
    alert(error.message);
}

}

async function download() {

    try {

        const snapshot = await getDocs(collection(db, "ledger"));

        let csv =
    "Owner,Maintenance Month,Date,Flat,Type,Maintenance Due,Actually Paid,Previous Outstanding,Current Outstanding,Remarks\n";

        snapshot.forEach((doc) => {

            const row = doc.data();

            csv +=
    `"${row.owner || ""}",` +
    `"${row.maintenanceMonth || ""}",` +
    `"${row.date || ""}",` +
    `"${row.flat || ""}",` +
    `"${row.type || ""}",` +
    `"${row.maintenanceDue || 0}",` +
    `"${row.actuallyPaid ?? row.amount ?? 0}",` +
    `"${row.previousBalance || 0}",` +
    `"${row.balance || 0}",` +
    `"${row.remarks || ""}"\n`;

        });

        const blob =
            new Blob([csv], { type: "text/csv" });

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "Building_Maintenance_Ledger.csv";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    } catch (error) {

        console.error(error);

        alert("Failed to export CSV.");
    }
}

        document.getElementById("ledgerPage").style.display = "none";

    }

});
