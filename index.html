<tr>

        </select>

<td>Amount</td>

<tr><td>Remarks</td><td><input id="remarks"></td></tr></table><button onclick="add()">Add Entry</button>

<table id="tbl">
<thead>
<tr>
    <th>Owner</th>
    <th>Date</th>
    <th>Flat</th>

    <th>Amount</th>
    <th>Remarks</th>
</tr>
</thead>
<tbody></tbody>
</table><script type="module">
  
  //firebase initialization

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBTvD-JiSK6NniNJQrpmecTQk_qbOx3AQk",
  authDomain: "shivam-maintenance.firebaseapp.com",
  projectId: "shivam-maintenance",
  storageBucket: "shivam-maintenance.firebasestorage.app",
  messagingSenderId: "462528226683",
  appId: "1:462528226683:web:0acf5da15565a8c8b809de",
  measurementId: "G-M6PJQB5D1Q"
};

// Connect to Firebase
const app = initializeApp(firebaseConfig);

// Connect to Firestore
const db = getFirestore(app);
//Connect to Firebase authentication
const auth = getAuth(app);


async function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    message.textContent = "Logging in...";

    if (!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
    }

    try {

        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        console.log("Login successful:", userCredential.user.email);

        message.textContent = "Login successful!";

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("ledgerPage").style.display = "block";

        await loadLedger();

    } catch (error) {

        console.error("LOGIN ERROR:", error);

        message.textContent =
            error.code + " : " + error.message;
    }
}

async function logout() {

    try {

        await signOut(auth);

        document.getElementById("ledgerPage").style.display = "none";
        document.getElementById("loginPage").style.display = "block";

        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";
        document.getElementById("loginMessage").textContent = "";

    } catch (error) {

        console.error(error);
        alert("Logout failed.");

    }
}



  
async function add() {
const owner = document.getElementById("owner").value;

    const date = document.getElementById("date").value;
    const flat = document.getElementById("flat").value;
    const type = document.getElementById("type").value;
    const amount = document.getElementById("amount").value;
    const remarks = document.getElementById("remarks").value;

    if (!owner || !date || !flat || !amount) {
    alert("Please select Owner and enter Date, Flat and Amount.");
    return;
}

    try {

        await addDoc(collection(db, "ledger"), {
    owner: owner,
    date: date,
    flat: flat,
    type: type,
    amount: Number(amount),
    remarks: remarks,
    createdAt: new Date()
});

        alert("Entry added successfully.");
document.getElementById("owner").value = "";
        // Clear the form
        document.getElementById("date").value = "";
        document.getElementById("flat").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("remarks").value = "";

        // Refresh the table
        await loadLedger();

    } catch (error) {
        console.error(error);
        alert(error.message);
    }

}


async function loadLedger() {

    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";

    try {

        const snapshot = await getDocs(collection(db, "ledger"));

        snapshot.forEach((doc) => {

            const row = doc.data();

            const tr = document.createElement("tr");

            tr.innerHTML = `
    <td>${row.owner || ""}</td>
    <td>${row.date || ""}</td>
    <td>${row.flat || ""}</td>
    <td>${row.type || ""}</td>
    <td>${row.amount || ""}</td>
    <td>${row.remarks || ""}</td>
`;

            tbody.appendChild(tr);

        });

    } catch (error) {
    console.error(error);
    alert(error.message);
}

}

async function download() {

    try {

        const snapshot = await getDocs(collection(db, "ledger"));

        let csv = "Owner,Date,Flat,Type,Amount,Remarks\n";
        snapshot.forEach((doc) => {

            const row = doc.data();

            csv += `"${row.owner || ""}","${row.date || ""}","${row.flat || ""}","${row.type || ""}","${row.amount || ""}","${row.remarks || ""}"\n`;

        });

        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "Building_Maintenance_Ledger.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    } catch (error) {
        console.error(error);
        alert("Failed to export CSV.");
    }

}


window.login = login;
window.logout = logout;
window.add = add;
window.download = download;


// Check whether the user is already logged in
onAuthStateChanged(auth, (user) => {

    if (user) {

        // User is logged in
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("ledgerPage").style.display = "block";

        loadLedger();

    } else {

        // User is not logged in
        document.getElementById("loginPage").style.display = "block";
        document.getElementById("ledgerPage").style.display = "none";

    }

});

</script></body></html>
