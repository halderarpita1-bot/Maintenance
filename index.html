<!DOCTYPE html><html><head><meta charset="utf-8"><title>Building Maintenance Ledger</title><style>body{font-family:Arial;margin:20px;max-width:900px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px}input{width:100%}</style></head><body><h2>Building Maintenance Ledger</h2><table><tr><td>Date</td><td><input id="date" type="date"></td></tr><tr><td>Flat</td><td><input id="flat"></td></tr><tr><td>Type</td><td><select id="type"><option>Maintenance Received</option><option>Building Expense</option></select></td></tr><tr><td>Amount</td><td><input id="amount" type="number"></td></tr><tr><td>Remarks</td><td><input id="remarks"></td></tr></table><button onclick="add()">Add Entry</button><button onclick="download()">Export CSV</button><table id="tbl"><thead><tr><th>Date</th><th>Flat</th><th>Type</th><th>Amount</th><th>Remarks</th></tr></thead><tbody></tbody></table><script type="module">
  
  //firebase initialization

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTvD-JiSK6NniNJQrpmecTQk_qbOx3AQk",
  authDomain: "shivam-maintenance.firebaseapp.com",
  projectId: "shivam-maintenance",
  storageBucket: "shivam-maintenance.firebasestorage.app",
  messagingSenderId: "462528226683",
  appId: "1:462528226683:web:0acf5da15565a8c8b809de",
  measurementId: "G-M6PJQB5D1Q"
};

// Connect to Firebase
const app = initializeApp(firebaseConfig);

// Connect to Firestore
const db = getFirestore(app);


  
async function add() {

    const date = document.getElementById("date").value;
    const flat = document.getElementById("flat").value;
    const type = document.getElementById("type").value;
    const amount = document.getElementById("amount").value;
    const remarks = document.getElementById("remarks").value;

    if (!date || !flat || !amount) {
        alert("Please enter Date, Flat and Amount.");
        return;
    }

    try {

        await addDoc(collection(db, "ledger"), {
            date: date,
            flat: flat,
            type: type,
            amount: Number(amount),
            remarks: remarks,
            createdAt: new Date()
        });

        alert("Entry added successfully.");

        // Clear the form
        document.getElementById("date").value = "";
        document.getElementById("flat").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("remarks").value = "";

        // Refresh the table
        await loadLedger();

    } catch (error) {
        console.error(error);
        alert(error.message);
    }

}


async function loadLedger() {

    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";

    try {

        const snapshot = await getDocs(collection(db, "ledger"));

        snapshot.forEach((doc) => {

            const row = doc.data();

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row.date || ""}</td>
                <td>${row.flat || ""}</td>
                <td>${row.type || ""}</td>
                <td>${row.amount || ""}</td>
                <td>${row.remarks || ""}</td>
            `;

            tbody.appendChild(tr);

        });

    } catch (error) {
    console.error(error);
    alert(error.message);
}

}




async function download() {

    try {

        const snapshot = await getDocs(collection(db, "ledger"));

        let csv = "Date,Flat,Type,Amount,Remarks\n";

        snapshot.forEach((doc) => {

            const row = doc.data();

            csv += `"${row.date || ""}","${row.flat || ""}","${row.type || ""}","${row.amount || ""}","${row.remarks || ""}"\n`;

        });

        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "Building_Maintenance_Ledger.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    } catch (error) {
        console.error(error);
        alert("Failed to export CSV.");
    }

}


window.add = add;
window.download = download;
loadLedger();
</script></body></html>
