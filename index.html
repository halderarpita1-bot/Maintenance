function flatSelected() {

const flat = document.getElementById("flat").value;  

if (!flat) {  
    document.getElementById("maintenanceDue").value = "";

    document.getElementById("balance").value = "";  
    return;  
}  

const due = maintenanceRates[flat] || 0;  

document.getElementById("maintenanceDue").value = due;  

calculatePreviousBalance();

}

async function calculatePreviousBalance() {

try {  

    const owner =  
        document.getElementById("owner").value;  

    const flat =  
        document.getElementById("flat").value;  

    const maintenanceMonth =  
        document.getElementById("maintenanceMonth").value;  

    if (!owner || !flat || !maintenanceMonth) {  
        document.getElementById("previousBalance").value = "";  
        document.getElementById("balance").value = "";  
        return;  
    }  

    const [year, month] =  
        maintenanceMonth.split("-").map(Number);  

    const monthlyDue =  
        maintenanceRates[flat] || 0;  

    // January = 1, February = 2 ... August = 8  
    const totalMaintenanceDue =  
        monthlyDue * month;  

    const snapshot =  
        await getDocs(collection(db, "ledger"));  

    let totalPaidBeforeCurrentMonth = 0;  

    let totalPaidUpToCurrentMonth = 0;  

    snapshot.forEach((doc) => {  

        const row = doc.data();  

        if (  
            row.owner === owner &&  
            row.flat === flat &&  
            row.type === "Maintenance Received" &&  
            row.maintenanceMonth  
        ) {  

            const [rowYear, rowMonth] =  
                row.maintenanceMonth  
                    .split("-")  
                    .map(Number);  

            if (rowYear === year) {  

                const paid =  
                    Number(  
                        row.actuallyPaid ??  
                        row.amount ??  
                        0  
                    );  

                // Payments before selected month  
                if (rowMonth < month) {  
                    totalPaidBeforeCurrentMonth += paid;  
                }  

                // Payments up to selected month  
                if (rowMonth <= month) {  
                    totalPaidUpToCurrentMonth += paid;  
                }  
            }  
        }  
    });  


    /*  
     * PREVIOUS OUTSTANDING  
     *  
     * Jan -> selected month total due  
     * minus payments before selected month  
     *  
     * Example:  
     * August = 8 months  
     * 495 × 8 = 3960  
     * Previous payments = 0  
     *  
     * Previous Outstanding = 3960  
     */  

    const previousOutstanding =  
        totalMaintenanceDue -  
        totalPaidBeforeCurrentMonth;  


    /*  
     * CURRENT OUTSTANDING  
     *  
     * Total Jan-current due  
     * minus all payments Jan-current  
     */  

    const currentOutstanding =  
        totalMaintenanceDue -  
        totalPaidUpToCurrentMonth;  


    document.getElementById("previousBalance").value =  
        previousOutstanding;  

    document.getElementById("balance").value =  
        currentOutstanding;  


} catch (error) {  

    console.error(error);  

    alert("Unable to calculate outstanding.");  
}

}

// Recalculate when owner changes
document.getElementById("owner")
.addEventListener("change", calculatePreviousBalance);

// Recalculate when maintenance month changes
document.getElementById("maintenanceMonth")
.addEventListener("change", calculatePreviousBalance);

function calculateCurrentBalance() {

const previous =  
    Number(  
        document.getElementById("previousBalance").value  
    ) || 0;  

const paid =  
    Number(  
        document.getElementById("amount").value  
    ) || 0;  

const currentBalance =  
    previous - paid;  

document.getElementById("balance").value =  
    currentBalance;

}

async function recalculateLedger() {

    if (!confirm(
        "This will recalculate Previous Outstanding and Current Outstanding for all maintenance records. Continue?"
    )) {
        return;
    }

    try {

        const snapshot =
            await getDocs(collection(db, "ledger"));

        // Convert Firestore documents into an array
        const records = [];

        snapshot.forEach((document) => {

            records.push({
                id: document.id,
                data: document.data()
            });

        });


        /*
         * Process every Maintenance Received record
         */

        for (const record of records) {

            const row = record.data;

            if (
                row.type !== "Maintenance Received" ||
                !row.owner ||
                !row.flat ||
                !row.maintenanceMonth
            ) {
                continue;
            }


            const [year, month] =
                row.maintenanceMonth
                    .split("-")
                    .map(Number);


            const monthlyDue =
                maintenanceRates[row.flat] || 0;


            /*
             * Total maintenance due
             * from January through selected month
             */

            const totalMaintenanceDue =
                monthlyDue * month;


            let totalPaidBeforeCurrentMonth = 0;
            let totalPaidUpToCurrentMonth = 0;


            /*
             * Look through ALL records belonging
             * to the same owner, flat and year.
             */

            records.forEach((otherRecord) => {

                const other =
                    otherRecord.data;


                if (
                    other.owner === row.owner &&
                    other.flat === row.flat &&
                    other.type === "Maintenance Received" &&
                    other.maintenanceMonth
                ) {

                    const [otherYear, otherMonth] =
                        other.maintenanceMonth
                            .split("-")
                            .map(Number);


                    if (otherYear === year) {

                        const paid =
                            Number(
                                other.actuallyPaid ??
                                other.amount ??
                                0
                            );


                        /*
                         * Payments before this record's month
                         */

                        if (otherMonth < month) {

                            totalPaidBeforeCurrentMonth +=
                                paid;

                        }


                        /*
                         * Payments up to and including
                         * this record's month
                         */

                        if (otherMonth <= month) {

                            totalPaidUpToCurrentMonth +=
                                paid;

                        }

                    }

                }

            });


            /*
             * IMPORTANT:
             *
             * The current record's payment is already
             * included in totalPaidUpToCurrentMonth.
             *
             * Therefore:
             *
             * Previous Outstanding =
             * Jan-current due
             * minus payments before current month
             *
             * Current Outstanding =
             * Jan-current due
             * minus all payments through current month
             */

            const previousBalance =
                totalMaintenanceDue -
                totalPaidBeforeCurrentMonth;


            const currentBalance =
                totalMaintenanceDue -
                totalPaidUpToCurrentMonth;


            /*
             * Update Firestore record
             */

            await updateDoc(
                doc(db, "ledger", record.id),
                {
                    maintenanceDue:
                        monthlyDue,

                    previousBalance:
                        previousBalance,

                    balance:
                        currentBalance
                }
            );

        }


        alert(
            "Ledger recalculated successfully."
        );


        // Refresh table
        await loadLedger();


    } catch (error) {

        console.error(
            "RECALCULATE ERROR:",
            error
        );

        alert(
            "Failed to recalculate ledger: " +
            error.message
        );

    }
}

async function add() {

    const owner =
        document.getElementById("owner").value;

    const date =
        document.getElementById("date").value;

    const maintenanceMonth =
        document.getElementById("maintenanceMonth").value;

    const flat =
        document.getElementById("flat").value;

    const type =
        document.getElementById("type").value;

    const amount =
        Number(
            document.getElementById("amount").value
        ) || 0;

    const remarks =
        document.getElementById("remarks").value;


    if (!owner || !date || !maintenanceMonth || !flat || !amount) {

        alert(
            "Please select Owner, Maintenance Month, Date, Flat and enter Amount."
        );

        return;
    }


    try {

        const [year, month] =
            maintenanceMonth.split("-").map(Number);

        const monthlyDue =
            maintenanceRates[flat] || 0;


        let previousBalance = 0;
        let currentBalance = 0;


        if (type === "Maintenance Received") {

            /*
             * TOTAL MAINTENANCE DUE
             *
             * January to selected month
             */

            const totalMaintenanceDue =
                monthlyDue * month;


            const snapshot =
                await getDocs(collection(db, "ledger"));


            let totalPaidBeforeCurrentMonth = 0;
            let totalPaidUpToCurrentMonth = 0;


            snapshot.forEach((doc) => {

                const row = doc.data();


                /*
                 * Only consider the SAME owner,
                 * SAME flat and SAME year.
                 */

                if (
                    row.owner === owner &&
                    row.flat === flat &&
                    row.type === "Maintenance Received" &&
                    row.maintenanceMonth
                ) {

                    const [rowYear, rowMonth] =
                        row.maintenanceMonth
                            .split("-")
                            .map(Number);


                    if (rowYear === year) {

                        const paid =
                            Number(
                                row.actuallyPaid ??
                                row.amount ??
                                0
                            );


                        /*
                         * Payments before selected month
                         */

                        if (rowMonth < month) {

                            totalPaidBeforeCurrentMonth += paid;

                        }


                        /*
                         * Payments up to selected month
                         */

                        if (rowMonth <= month) {

                            totalPaidUpToCurrentMonth += paid;

                        }

                    }

                }

            });


            /*
             * PREVIOUS OUTSTANDING
             *
             * Jan → selected month due
             * minus payments before selected month
             */

            previousBalance =
                totalMaintenanceDue -
                totalPaidBeforeCurrentMonth;


            /*
             * CURRENT OUTSTANDING
             *
             * Jan → selected month due
             * minus existing payments
             * minus current payment
             */

            currentBalance =
                totalMaintenanceDue -
                totalPaidUpToCurrentMonth -
                amount;

        }


        await addDoc(
            collection(db, "ledger"),
            {

                owner:
                    owner,

                maintenanceMonth:
                    maintenanceMonth,

                date:
                    date,

                flat:
                    flat,

                type:
                    type,

                amount:
                    amount,

                maintenanceDue:
                    monthlyDue,

                actuallyPaid:
                    type === "Maintenance Received"
                        ? amount
                        : 0,

                previousBalance:
                    previousBalance,

                balance:
                    currentBalance,

                remarks:
                    remarks,

                createdAt:
                    new Date()
            }
        );


        alert("Entry added successfully.");


        /*
         * Clear form
         */

        document.getElementById("owner").value = "";

        document.getElementById("maintenanceMonth").value = "";

        document.getElementById("date").value = "";

        document.getElementById("flat").value = "";

        document.getElementById("amount").value = "";

        document.getElementById("maintenanceDue").value = "";

        document.getElementById("previousBalance").value = "";

        document.getElementById("balance").value = "";

        document.getElementById("remarks").value = "";


        await loadLedger();


    } catch (error) {

        console.error(error);

        alert(error.message);

    }
}

}

async function download() {

try {  

    const snapshot = await getDocs(collection(db, "ledger"));  

    let csv =  
"Owner,Maintenance Month,Date,Flat,Type,Maintenance Due,Actually Paid,Previous Outstanding,Current Outstanding,Remarks\n";  

    snapshot.forEach((doc) => {  

        const row = doc.data();  

        csv +=  
`"${row.owner || ""}",` +  
`"${row.maintenanceMonth || ""}",` +  
`"${row.date || ""}",` +  
`"${row.flat || ""}",` +  
`"${row.type || ""}",` +  
`"${row.maintenanceDue || 0}",` +  
`"${row.actuallyPaid ?? row.amount ?? 0}",` +  
`"${row.previousBalance || 0}",` +  
`"${row.balance || 0}",` +  
`"${row.remarks || ""}"\n`;  

    });  

    const blob =  
        new Blob([csv], { type: "text/csv" });  

    const url =  
        URL.createObjectURL(blob);  

    const a =  
        document.createElement("a");  

    a.href = url;  

    a.download =  
        "Building_Maintenance_Ledger.csv";  

    document.body.appendChild(a);  

    a.click();  

    document.body.removeChild(a);  

    URL.revokeObjectURL(url);  

} catch (error) {  

    console.error(error);  

    alert("Failed to export CSV.");  
}

}
