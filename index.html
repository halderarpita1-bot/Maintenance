async function calculatePreviousBalance() {

    const owner =
        document.getElementById("owner").value;

    const flat =
        document.getElementById("flat").value;

    const maintenanceMonth =
        document.getElementById("maintenanceMonth").value;


    if (!owner || !flat || !maintenanceMonth) {

        document.getElementById("previousBalance").value = "";
        document.getElementById("balance").value = "";

        return;
    }


    try {

        const [year, month] =
            maintenanceMonth
                .split("-")
                .map(Number);


        const monthlyDue =
            maintenanceRates[flat] || 0;


        const snapshot =
            await getDocs(
                collection(db, "ledger")
            );


        const records = [];


        snapshot.forEach((document) => {

            const row =
                document.data();


            if (
                row.owner === owner &&
                row.flat === flat &&
                row.type === "Maintenance Received" &&
                row.maintenanceMonth
            ) {

                records.push(row);

            }

        });


        /*
         * Find the first recorded year.
         */

        /*
 * STEP 9:
 * Maintenance calculation starts from
 * January of the current year.
 */

const [startYear, startMonth] =
    maintenanceStartMonth
        .split("-")
        .map(Number);


        /*
         * Number of months before
         * the selected month.
         */

        const monthsBeforeCurrent =
    (
        (year - startYear) * 12
    ) +
    (month - startMonth);


        /*
         * Maintenance due before
         * the selected month.
         */

        const totalDueBeforeCurrent =
            monthlyDue *
            Math.max(
                monthsBeforeCurrent,
                0
            );


        /*
         * Calculate all payments
         * before the selected month.
         */

        let totalPaidBeforeCurrentMonth = 0;


        records.forEach((row) => {

            const [rowYear, rowMonth] =
                row.maintenanceMonth
                    .split("-")
                    .map(Number);


const rowPeriod =
    (
        (rowYear - startYear) * 12
    ) +
    (rowMonth - startMonth);


const currentPeriod =
    (
        (year - startYear) * 12
    ) +
    (month - startMonth);
                


            if (rowPeriod < currentPeriod) {

                const paid =
                    Number(
                        row.actuallyPaid ??
                        row.amount ??
                        0
                    );


                totalPaidBeforeCurrentMonth +=
                    paid;

            }

        });


        /*
         * Previous Outstanding
         */

        const previousBalance =
            totalDueBeforeCurrent -
            totalPaidBeforeCurrentMonth;


        /*
         * Current month's maintenance
         */

        const currentBalanceBeforePayment =
            previousBalance +
            monthlyDue;


        document.getElementById("previousBalance").value =
            previousBalance;


        document.getElementById("balance").value =
            currentBalanceBeforePayment;


        /*
         * Recalculate after loading
         * the previous balance.
         */

        await calculateCurrentBalance();


    } catch (error) {

        console.error(
            "PREVIOUS BALANCE ERROR:",
            error
        );

        alert(
            "Unable to calculate outstanding: " +
            error.message
        );

    }

}

async function calculateCurrentBalance() {

    const owner =
        document.getElementById("owner").value;

    const flat =
        document.getElementById("flat").value;

    const maintenanceMonth =
        document.getElementById("maintenanceMonth").value;

    const paidNow =
        Number(
            document.getElementById("amount").value
        ) || 0;


    if (!owner || !flat || !maintenanceMonth) {

        document.getElementById("balance").value = "";

        return;

    }


    try {

        const [year, month] =
            maintenanceMonth
                .split("-")
                .map(Number);


        const monthlyDue =
            maintenanceRates[flat] || 0;


        /*
         * Previous Outstanding has already
         * been calculated.
         */

        const previousBalance =
            Number(
                document.getElementById("previousBalance").value
            ) || 0;


        /*
         * Find payments already received
         * for the selected maintenance month.
         */

        const snapshot =
            await getDocs(
                collection(db, "ledger")
            );


        let paidInCurrentMonth = 0;


        snapshot.forEach((document) => {

            const row =
                document.data();


            if (
                row.owner === owner &&
                row.flat === flat &&
                row.type === "Maintenance Received" &&
                row.maintenanceMonth === maintenanceMonth
            ) {

                const paid =
                    Number(
                        row.actuallyPaid ??
                        row.amount ??
                        0
                    );


                paidInCurrentMonth +=
                    paid;

            }

        });


        /*
         * Current Outstanding =
         *
         * Previous Outstanding
         * + Current Month Due
         * - Existing Current Month Payments
         * - New Payment
         */

        const currentBalance =
            previousBalance +
            monthlyDue -
            paidInCurrentMonth -
            paidNow;


        document.getElementById("balance").value =
            currentBalance;


    } catch (error) {

        console.error(
            "CURRENT BALANCE ERROR:",
            error
        );

    }

}

async function recalculateLedger() {

    if (!confirm(
        "This will recalculate Previous Outstanding and Current Outstanding for all maintenance records. Continue?"
    )) {
        return;
    }

    try {

        const snapshot =
            await getDocs(
                collection(db, "ledger")
            );

        /*
         * Convert Firestore documents
         * into an array.
         */

        const records = [];

        snapshot.forEach((document) => {

            records.push({
                id: document.id,
                data: document.data()
            });

        });

        /*
         * Maintenance calculation starts
         * from January 2026.
         *
         * IMPORTANT:
         * Keep this fixed so that the calculation
         * does not change automatically next year.
         */

        const maintenanceStartMonth = "2026-01";

        const [startYear, startMonth] =
            maintenanceStartMonth
                .split("-")
                .map(Number);

        /*
         * Process every maintenance record.
         */

        for (const record of records) {

            const row =
                record.data;

            /*
             * Only Maintenance Received records
             * participate in outstanding calculation.
             */

            if (
                row.type !== "Maintenance Received" ||
                !row.owner ||
                !row.flat ||
                !row.maintenanceMonth
            ) {
                continue;
            }

            const [year, month] =
                row.maintenanceMonth
                    .split("-")
                    .map(Number);

            const monthlyDue =
                maintenanceRates[row.flat] || 0;

            /*
             * Calculate the period number
             * relative to January 2026.
             *
             * January 2026 = 0
             * February 2026 = 1
             * March 2026 = 2
             * etc.
             */

            const currentPeriod =
                (
                    (year - startYear) * 12
                ) +
                (month - startMonth);

            /*
             * If the record is before January 2026,
             * do not calculate maintenance due for it.
             */

            if (currentPeriod < 0) {
                continue;
            }

            /*
             * Maintenance due BEFORE
             * the current month.
             *
             * Example:
             *
             * August 2026
             *
             * Jan-Jul = 7 months
             */

            const monthsBeforeCurrent =
                currentPeriod;

            const totalDueBeforeCurrent =
                monthlyDue *
                Math.max(
                    monthsBeforeCurrent,
                    0
                );

            /*
             * Calculate ALL payments made
             * before the current month.
             */

            let totalPaidBeforeCurrentMonth = 0;

            records.forEach((otherRecord) => {

                const other =
                    otherRecord.data;

                if (
                    other.owner === row.owner &&
                    other.flat === row.flat &&
                    other.type === "Maintenance Received" &&
                    other.maintenanceMonth
                ) {

                    const [otherYear, otherMonth] =
                        other.maintenanceMonth
                            .split("-")
                            .map(Number);

                    const otherPeriod =
                        (
                            (otherYear - startYear) * 12
                        ) +
                        (otherMonth - startMonth);

                    /*
                     * IMPORTANT:
                     *
                     * Ignore payments before January 2026.
                     *
                     * Count only payments strictly
                     * before the current month.
                     */

                    if (
                        otherPeriod >= 0 &&
                        otherPeriod < currentPeriod
                    ) {

                        const paid =
                            Number(
                                other.actuallyPaid ??
                                other.amount ??
                                0
                            );

                        totalPaidBeforeCurrentMonth +=
                            paid;
                    }
                }
            });

            /*
             * PREVIOUS OUTSTANDING
             *
             * Maintenance due before current month
             * minus
             * payments before current month.
             */

            const previousBalance =
                totalDueBeforeCurrent -
                totalPaidBeforeCurrentMonth;

            /*
             * Calculate ALL payments received
             * up to and including current month.
             */

            let totalPaidUpToCurrentMonth = 0;

            records.forEach((otherRecord) => {

                const other =
                    otherRecord.data;

                if (
                    other.owner === row.owner &&
                    other.flat === row.flat &&
                    other.type === "Maintenance Received" &&
                    other.maintenanceMonth
                ) {

                    const [otherYear, otherMonth] =
                        other.maintenanceMonth
                            .split("-")
                            .map(Number);

                    const otherPeriod =
                        (
                            (otherYear - startYear) * 12
                        ) +
                        (otherMonth - startMonth);

                    /*
                     * IMPORTANT:
                     *
                     * Ignore payments before January 2026.
                     *
                     * Include payments from January 2026
                     * through the current month.
                     */

                    if (
                        otherPeriod >= 0 &&
                        otherPeriod <= currentPeriod
                    ) {

                        const paid =
                            Number(
                                other.actuallyPaid ??
                                other.amount ??
                                0
                            );

                        totalPaidUpToCurrentMonth +=
                            paid;
                    }
                }
            });

            /*
             * Total maintenance due INCLUDING
             * the current month.
             */

            const totalDueThroughCurrent =
                totalDueBeforeCurrent +
                monthlyDue;

            /*
             * CURRENT OUTSTANDING
             *
             * Total due through current month
             * minus
             * all payments through current month.
             */

            const currentBalance =
                totalDueThroughCurrent -
                totalPaidUpToCurrentMonth;

            /*
             * Update Firestore.
             */

            await updateDoc(
                doc(
                    db,
                    "ledger",
                    record.id
                ),
                {
                    maintenanceDue:
                        monthlyDue,

                    previousBalance:
                        previousBalance,

                    balance:
                        currentBalance
                }
            );
        }

        alert(
            "Ledger recalculated successfully."
        );

        /*
         * Reload the ledger after recalculation.
         */

        await loadLedger();

    } catch (error) {

        console.error(
            "RECALCULATE ERROR:",
            error
        );

        alert(
            "Failed to recalculate ledger: " +
            error.message
        );
    }
}

            collection(db, "ledger"),
            {

                owner:
                    owner,

                maintenanceMonth:
                    maintenanceMonth,

                date:
                    date,

                flat:
                    flat,

                type:
                    type,

                amount:
                    amount,

                maintenanceDue:
                    monthlyDue,

                actuallyPaid:
                    type === "Maintenance Received"
                        ? amount
                        : 0,

                previousBalance:
                    previousBalance,

                balance:
                    currentBalance,

                remarks:
                    remarks,

                createdAt:
                    new Date()
            }
        );


        alert(
            "Entry added successfully."
        );


        /*
         * Clear form.
         */

        document.getElementById("owner").value = "";

        document.getElementById("maintenanceMonth").value = "";

        document.getElementById("date").value = "";

        document.getElementById("flat").value = "";

        document.getElementById("amount").value = "";

        document.getElementById("maintenanceDue").value = "";

        document.getElementById("previousBalance").value = "";

        document.getElementById("balance").value = "";

        document.getElementById("remarks").value = "";


        /*
         * Refresh ledger.
         */

        await loadLedger();


    } catch (error) {

        console.error(
            "ADD ENTRY ERROR:",
            error
        );

        alert(
            "Failed to add entry: " +
            error.message
        );

    }

}

async function loadLedger() {

    const tbody =
        document.querySelector("#tbl tbody");

    tbody.innerHTML = "";

    try {

        const snapshot =
            await getDocs(collection(db, "ledger"));


        /*
         * Store records so filterLedger()
         * can use them without querying Firebase again.
         */

        window.ledgerRecords = [];


        snapshot.forEach((document) => {

            window.ledgerRecords.push({
                id: document.id,
                data: document.data()
            });

        });


        /*
         * Populate Year filter
         */

        const yearSelect =
            document.getElementById("filterYear");

        const years = new Set();


        window.ledgerRecords.forEach((record) => {

            const row = record.data;

            if (row.maintenanceMonth) {

                const year =
                    row.maintenanceMonth.substring(0, 4);

                years.add(year);

            }

        });


        yearSelect.innerHTML =
            '<option value="">All Years</option>';


        [...years]
            .sort()
            .forEach((year) => {

                const option =
                    document.createElement("option");

                option.value = year;
                option.textContent = year;

                yearSelect.appendChild(option);

            });


        /*
         * Display all records
         */

        displayLedger(window.ledgerRecords);


    } catch (error) {

        console.error(error);

        alert(error.message);

    }
}

function filterLedger() {

    const selectedOwner =
        document.getElementById("filterOwner").value;

    const selectedYear =
        document.getElementById("filterYear").value;

    const filteredRecords =
        window.ledgerRecords.filter((record) => {

            const row = record.data;

            const ownerMatches =
                !selectedOwner ||
                row.owner === selectedOwner;

            const yearMatches =
                !selectedYear ||
                (
                    row.maintenanceMonth &&
                    row.maintenanceMonth.startsWith(selectedYear)
                );

            return ownerMatches && yearMatches;

        });

    displayLedger(filteredRecords);
}

function displayLedger(records) {

    const tbody =
        document.querySelector("#tbl tbody");

    tbody.innerHTML = "";

    if (!records || records.length === 0) {

        const tr =
            document.createElement("tr");

        tr.innerHTML = `
            <td colspan="10" style="text-align:center;">
                No records found
            </td>
        `;

        tbody.appendChild(tr);

        return;
    }


    records.forEach((record) => {

        const row =
            record.data;

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

<td>${row.owner ?? ""}</td>

<td>${row.maintenanceMonth ?? ""}</td>

<td>${row.date ?? ""}</td>

<td>${row.flat ?? ""}</td>

<td>${row.type ?? ""}</td>

<td>
    ${
        row.type === "Maintenance Received"
        ? "₹" + (row.maintenanceDue ?? 0)
        : ""
    }
</td>

<td>
    ${
        row.type === "Maintenance Received"
        ? "₹" + (row.actuallyPaid ?? row.amount ?? 0)
        : ""
    }
</td>

<td>
    ${
        row.type === "Maintenance Received"
        ? "₹" + (row.previousBalance ?? 0)
        : ""
    }
</td>

<td>
    ${
        row.type === "Maintenance Received"
        ? "₹" + (row.balance ?? 0)
        : ""
    }
</td>

<td>${row.remarks ?? ""}</td>

`;


        tbody.appendChild(tr);

    });

}

function clearFilters() {

    document.getElementById("filterOwner").value = "";

    document.getElementById("filterYear").value = "";

    displayLedger(window.ledgerRecords);

}

async function download() {

    try {

        /*
         * Get current filter values
         */
        const selectedOwner =
            document.getElementById("filterOwner").value;

        const selectedYear =
            document.getElementById("filterYear").value;


        /*
         * Use the already-loaded ledger records.
         * This means the CSV follows the filters
         * currently selected on screen.
         */
        const records =
            (window.ledgerRecords || []).filter((record) => {

                const row = record.data;


                const ownerMatches =
                    !selectedOwner ||
                    row.owner === selectedOwner;


                const yearMatches =
                    !selectedYear ||
                    (
                        row.maintenanceMonth &&
                        row.maintenanceMonth.startsWith(selectedYear)
                    );


                return ownerMatches && yearMatches;

            });


        /*
         * CSV headers
         */
        const headers = [

            "Owner",
            "Maintenance Month",
            "Date",
            "Flat",
            "Type",
            "Maintenance Due",
            "Actually Paid",
            "Previous Outstanding",
            "Current Outstanding",
            "Remarks"

        ];


        /*
         * Make a value safe for CSV.
         *
         * Example:
         * Soumen, ABC
         *
         * becomes:
         * "Soumen, ABC"
         *
         * Quotes inside text are doubled.
         */
        function csvField(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return '""';

            }


            return '"' +
                String(value)
                    .replace(/"/g, '""') +
                '"';

        }


        /*
         * Start CSV
         */
        let csv =
            headers
                .map(csvField)
                .join(",") +
            "\n";


        /*
         * Add filtered records
         */
        records.forEach((record) => {

            const row =
                record.data;


            const data = [

                row.owner || "",

                row.maintenanceMonth || "",

                row.date || "",

                row.flat || "",

                row.type || "",

                row.type === "Maintenance Received"
                    ? (row.maintenanceDue ?? 0)
                    : "",

                row.type === "Maintenance Received"
                    ? (row.actuallyPaid ?? row.amount ?? 0)
                    : "",

                row.type === "Maintenance Received"
                    ? (row.previousBalance ?? 0)
                    : "",

                row.type === "Maintenance Received"
                    ? (row.balance ?? 0)
                    : "",

                row.remarks || ""

            ];


            csv +=
                data
                    .map(csvField)
                    .join(",") +
                "\n";

        });


        /*
         * UTF-8 BOM.
         *
         * This helps Excel correctly display
         * characters such as ₹.
         */
        const blob =
            new Blob(
                ["\uFEFF" + csv],
                {
                    type: "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;


        /*
         * Give the file a useful name
         */
        let fileName =
            "Building_Maintenance_Ledger";


        if (selectedOwner) {

            fileName +=
                "_" +
                selectedOwner
                    .replace(/\s+/g, "_");

        }


        if (selectedYear) {

            fileName +=
                "_" +
                selectedYear;

        }


        fileName += ".csv";


        a.download = fileName;


        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);


        /*
         * Inform user if no records matched
         */
        if (records.length === 0) {

            alert(
                "No records found for the selected filters."
            );

        }


    } catch (error) {

        console.error(
            "CSV EXPORT ERROR:",
            error
        );

        alert(
            "Failed to export CSV: " +
            error.message
        );

    }

}
